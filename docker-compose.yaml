services:
  ortenau-guesser:
    container_name: ortenau-guesser
    build:
      context: .
      dockerfile: config/Dockerfile
    image: ortenau-guesser:latest
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - OSM_USER_AGENT=OrtenauGuesser/1.0 (Baden-Wuerttemberg GeoGame)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
